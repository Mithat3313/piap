# The AP radios are driven by hostapd; keep NetworkManager away from them.
# p2p-dev-* is listed too: a P2P scan on the same phy can knock the running AP down.
#
# DANGER: the LAN interface (eth0) must NEVER appear on this line. If it does, NM releases
# it, the DHCP lease is dropped, the LAN address disappears and the Pi is unreachable
# without a console. After any change ALWAYS run:
#   nmcli -t -f DEVICE,STATE dev status   -> the LAN interface must be 'connected'
[keyfile]
unmanaged-devices=__LIST__
