# Example WireGuard client profile (same format as the .conf issued by the server).
# Add it with: ap-ctl vpn add <name> <file>. Lines such as DNS=, Table= and PostUp= are
# stripped by ap-swap-peer.sh: the tunnel is brought up with Table=off and the host's DNS is untouched.
[Interface]
PrivateKey = <client private key>
Address = 10.0.0.2/32
MTU = 1420

[Peer]
PublicKey = <server public key>
PresharedKey = <optional>
Endpoint = vpn.example.net:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
