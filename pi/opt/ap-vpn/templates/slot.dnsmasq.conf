# Slot __SLOT__ (__AP_IF__) — this interface ONLY. Multi-instance safe: bind-interfaces + except-interface=lo
interface=__AP_IF__
bind-interfaces
except-interface=lo
listen-address=__NET__.1
no-hosts
no-resolv
# Upstream resolvers are queried from the tunnel's source address (server=IP@WG_SRC).
# WG_SRC is written by ap-swap-peer.sh when a profile is activated.
server=1.1.1.1@__WG_SRC__
server=1.0.0.1@__WG_SRC__
domain-needed
bogus-priv
local-ttl=0
dhcp-range=__NET__.50,__NET__.200,255.255.255.0,12h
dhcp-option=option:router,__NET__.1
dhcp-option=option:dns-server,__NET__.1
dhcp-option=option6:dns-server
no-ping
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/__SLOT__.leases
pid-file=/run/ap-dnsmasq-__SLOT__.pid
log-dhcp
