interface=__AP_IF__
driver=nl80211
# The _nomap suffix opts the network out of the Google/Apple/Mozilla positioning databases.
# Without it a client can report the real location via the BSSID even though the VPN exit
# appears to be in another country.
ssid=__SSID__

country_code=__COUNTRY__
ieee80211d=1
ieee80211h=0

# 5 GHz. Pick a non-DFS channel (36-48 in most countries); 80 MHz width.
hw_mode=a
channel=__CHANNEL__
ieee80211n=1
ieee80211ac=1
wmm_enabled=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=__VHT_SEG0__

# WPA2-PSK/CCMP. The Raspberry Pi's built-in radio (brcmfmac) is unreliable with WPA3-SAE in AP mode.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=__PSK__

# Clients cannot see each other.
ap_isolate=1
ignore_broadcast_ssid=0
max_num_sta=16

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
