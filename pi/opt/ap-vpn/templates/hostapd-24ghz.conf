interface=__AP_IF__
driver=nl80211
ssid=__SSID__
country_code=__COUNTRY__
ieee80211d=1
# 2.4 GHz, 20 MHz (the width that coexists best with neighbouring networks).
hw_mode=g
channel=__CHANNEL__
ieee80211n=1
wmm_enabled=1
ht_capab=[SHORT-GI-20]
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=__PSK__
ap_isolate=1
ignore_broadcast_ssid=0
max_num_sta=16
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
