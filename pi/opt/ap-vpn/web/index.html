<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiAP Manager</title>
<style>
:root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e8ee; --muted:#8a93a6; --ok:#3ddc84; --bad:#ff5d5d; --warn:#ffb347; --acc:#4f8cff; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif }
header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2 }
header h1 { font-size:16px; margin:0; font-weight:600 } header .sp { flex:1 }
nav button { background:none; border:0; color:var(--muted); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px }
nav button.on { background:var(--card); color:var(--fg) }
main { max-width:1100px; margin:0 auto; padding:18px 20px }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px }
.slot { display:grid; grid-template-columns: 1.1fr 1.3fr auto; gap:18px; align-items:start }
@media (max-width:820px){ .slot { grid-template-columns:1fr } }
.h { display:flex; align-items:center; gap:8px; margin-bottom:8px } .h b { font-size:15px }
.dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block } .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.k { color:var(--muted); font-size:12px } .mono { font-family:ui-monospace,Menlo,monospace; font-size:12.5px } .big { font-size:20px; font-weight:600 }
button, select, input { font:inherit }
.btn { background:#222735; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer } .btn:hover{ border-color:#3a4256 } .btn:disabled{ opacity:.45; cursor:default }
.btn.p { background:var(--acc); border-color:var(--acc); color:#fff } .btn.d { color:var(--bad); border-color:#4a2a2a } .btn.s { padding:3px 8px; font-size:12px }
select, input[type=text], input[type=password], textarea { background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 9px }
textarea { width:100%; min-height:130px; font-family:ui-monospace,Menlo,monospace; font-size:12px }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap } .col { display:flex; flex-direction:column; gap:6px }
.tag { font-size:11px; padding:2px 7px; border-radius:99px; background:#222735; color:var(--muted) } .tag.ok{ color:var(--ok) } .tag.bad{ color:var(--bad) }
.viol { margin-top:10px; padding:8px 10px; border:1px solid var(--bad); border-radius:8px; color:var(--bad); font-size:12px; line-height:1.5 }
table { width:100%; border-collapse:collapse } th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); font-size:13px } th { color:var(--muted); font-weight:500 }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222735; border:1px solid var(--line); padding:10px 14px; border-radius:10px; max-width:720px; display:none; white-space:pre-wrap; font-size:13px; z-index:5 }
#toast.bad { border-color:var(--bad) } #toast.ok { border-color:var(--ok) }
#busy { position:fixed; top:56px; right:20px; background:#222735; border:1px solid var(--line); padding:6px 12px; border-radius:8px; font-size:12px; display:none; z-index:3 }
.login { max-width:380px; margin:80px auto } .login input { width:100% } pre.log { background:#0f1115; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:60vh; overflow:auto; font-size:12px }
.switch { position:relative; width:42px; height:24px; background:#3a4256; border-radius:99px; cursor:pointer; border:0 } .switch.on { background:var(--ok) } .switch i { position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50% ; transition:left .15s } .switch.on i { left:21px }
</style>
</head>
<body>
<header><h1 id="title">PiAP Manager</h1><nav id="nav" hidden>
<button data-t="slots" class="on">SSIDs</button><button data-t="clients">Clients</button><button data-t="wifi">Wi-Fi</button><button data-t="vpn">VPN profiles</button><button data-t="logs">Log</button>
</nav><div class="sp"></div><span id="stamp" class="k"></span><button id="logout" class="btn s" hidden>Sign out</button></header>
<div id="busy"></div>
<main>
<div id="login" class="card login">
  <div class="h"><b>Sign in</b></div>
  <p class="k">Web panel password. On the Pi: <span class="mono">sudo ap-ctl web password</span></p>
  <form id="loginf" class="col"><input type="password" id="pw" placeholder="Password" autocomplete="current-password"><button class="btn p">Sign in</button></form>
</div>
<section id="t-slots" hidden></section>
<section id="t-clients" hidden></section>
<section id="t-wifi" hidden></section>
<section id="t-vpn" hidden></section>
<section id="t-logs" hidden></section>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtB = b => { const u=['B','KB','MB','GB']; let v=b||0,i=0; while(v>=1024&&i<3){v/=1024;i++} return (i?v.toFixed(1):v)+' '+u[i] };
const fmtD = s => s<60?`${s}s`:s<3600?`${Math.floor(s/60)}m`:s<86400?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h`;
let ST = null, PROFILES = [], WIFI = {}, CLIENTS = [], EXIT = {}, tab = 'slots', busyN = 0, timer = null;

function toast(msg, cls='') { const t=$('#toast'); t.textContent=msg; t.className=cls; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', cls==='bad'?9000:4000); }
function busy(label, on) { busyN += on?1:-1; const b=$('#busy'); b.textContent = label||''; b.style.display = busyN>0?'block':'none'; }
async function api(path, opt={}) {
  const o = { method: opt.method||'GET', headers: {'X-Requested-With':'piap'} };
  if (opt.body !== undefined) { o.headers['Content-Type']='application/json'; o.body = JSON.stringify(opt.body); }
  const r = await fetch(path, o); let j={}; try { j = await r.json(); } catch(e){}
  if (r.status === 401) { showLogin(); throw new Error('login required'); }
  if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j.result;
}
async function act(label, fn, after) { busy(label, true); try { const r = await fn(); if (after) await after(r); return r; } catch(e) { toast(`${label}: ${e.message}`, 'bad'); } finally { busy(label, false); } }

// ---------------- session
function showLogin() { $('#login').hidden=false; $('#nav').hidden=true; $('#logout').hidden=true; $$('main section').forEach(s=>s.hidden=true); clearInterval(timer); timer=null; }
function showApp() { $('#login').hidden=true; $('#nav').hidden=false; $('#logout').hidden=false; setTab(tab); if(!timer) timer=setInterval(()=>{ if(tab==='slots') refreshStatus(); }, 5000); }
$('#loginf').onsubmit = async e => { e.preventDefault(); try { await api('/api/login',{method:'POST',body:{password:$('#pw').value}}); $('#pw').value=''; showApp(); await refreshAll(); } catch(e){ toast(e.message,'bad'); } };
$('#logout').onclick = async () => { try{ await api('/api/logout',{method:'POST'}); }catch(e){} showLogin(); };
$$('#nav button').forEach(b => b.onclick = () => setTab(b.dataset.t));
function setTab(t) { tab=t; $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); $$('main section').forEach(s=>s.hidden = s.id!=='t-'+t); render(); if(t==='clients') refreshClients(); if(t==='wifi') refreshWifiAll(); if(t==='vpn') refreshProfiles(); }

// ---------------- data
async function refreshStatus(){ try { ST = await api('/api/status'); $('#stamp').textContent = 'updated ' + new Date().toLocaleTimeString(); if(tab==='slots') render(); } catch(e){ if(e.message!=='login required') toast(e.message,'bad'); } }
async function refreshProfiles(){ PROFILES = await api('/api/profiles'); render(); }
async function refreshClients(){ CLIENTS = await api('/api/clients'); render(); }
async function refreshWifiAll(){ for (const s of (ST?.slots||[])) WIFI[s.name] = await api('/api/wifi/'+s.name); render(); }
async function refreshAll(){ await refreshStatus(); await refreshProfiles(); }

// ---------------- actions
const confirmDo = (msg, label, fn, after) => { if (confirm(msg)) act(label, fn, after || (async()=>{ await refreshAll(); })); };
const ssidOf = slot => (ST?.slots||[]).find(x=>x.name===slot)?.ap?.ssid || slot;
const profOf = slot => (ST?.slots||[]).find(x=>x.name===slot)?.vpn?.profile || '—';
// ASSIGNMENT PINNING: every operation that changes the SSID-VPN mapping requires the affected SSIDs to be typed verbatim (enforced on the Pi as well).
function promptDo(msg, expected, label, fn, after) {
  const typed = prompt(`${msg}\n\nThis operation changes the SSID-VPN mapping. To confirm, type this text exactly:\n${expected}`, '');
  if (typed === null) return;
  if (typed.trim() !== expected) return toast(`The confirmation text did not match, nothing was done.\nExpected: ${expected}`, 'bad');
  act(label, ()=>fn(typed.trim()), after || (async()=>{ await refreshAll(); }));
}
function setProfile(slot, name, from) {
  if (from) promptDo(`"${name}" is currently on ${from} (${ssidOf(from)}). TAKE it from there and give it to ${slot} (${ssidOf(slot)})?\n${from} will be left WITHOUT A TUNNEL until you assign a new profile (the kill switch holds, its clients cannot reach the internet).`, `${ssidOf(slot)} / ${ssidOf(from)}`, `${slot} → ${name}`, c=>api(`/api/slot/${slot}/profile`,{method:'POST',body:{name,force:true,confirm:c}}), showSummary);
  else promptDo(`Switch ${slot} (${ssidOf(slot)}) to the profile "${name}"?\nThe tunnel is rebuilt; this SSID's clients lose connectivity for a few seconds (nothing leaks). If no handshake arrives, the previous profile is restored.`, ssidOf(slot), `${slot} → ${name}`, c=>api(`/api/slot/${slot}/profile`,{method:'POST',body:{name,confirm:c}}), showSummary);
}
function setMode(slot, mode){
  const m = mode==='direct'
    ? `Switch ${slot} (${ssidOf(slot)}) to DIRECT mode?\nClients will reach the internet through the LAN with NO VPN. The tunnel is stopped and the profile is detached.\nThey still cannot reach anything on the LAN itself.`
    : `Switch ${slot} (${ssidOf(slot)}) to VPN mode?\nUntil you assign a profile the clients get NO internet at all (kill switch).`;
  promptDo(m, ssidOf(slot), `${slot} → ${mode}`, c=>api(`/api/slot/${slot}/mode`,{method:'POST',body:{mode,confirm:c}}), async r=>{ await refreshAll(); toast(`${slot}: ${r.mode}`,'ok'); });
}
function syncRadio(slot){ act(`${slot} radio`, ()=>api(`/api/slot/${slot}/sync`,{method:'POST'}), async r=>{ await refreshAll(); toast(r.msg||'ok','ok'); }); }
function rePin(slot){ promptDo(`Pin the CURRENT state of ${slot} (SSID, profile, server key, radio MAC) and start the SSID?\nRight now: ${ssidOf(slot)} → ${profOf(slot)}`, ssidOf(slot), `pin ${slot}`, c=>api(`/api/slot/${slot}/pin`,{method:'POST',body:{confirm:c}}), async r=>{ await refreshStatus(); render(); toast(`Pinned: ${r.msg||''}`,'ok'); }); }
async function showSummary(r){ EXIT={}; await refreshAll(); if(r?.summary) toast(r.summary.join('\n'), 'ok'); }
function swapSlots(a,b){ promptDo(`${a} ⇄ ${b}: swap the VPN profiles of the two SSIDs?\n${ssidOf(a)} → ${profOf(b)}\n${ssidOf(b)} → ${profOf(a)}\nClients of both SSIDs lose connectivity briefly. This can take 1-3 minutes.`, `${ssidOf(a)} / ${ssidOf(b)}`, `${a} ⇄ ${b}`, c=>api('/api/swap',{method:'POST',body:{a,b,confirm:c}}), showSummary); }
function toggleSlot(slot, on){ confirmDo(on?`Turn ${slot} ON? The SSID goes on the air and the tunnel is brought up.`:`Turn ${slot} OFF? The SSID goes down, connected clients are dropped and the tunnel is stopped. The other SSID is unaffected.`, on?`${slot} on`:`${slot} off`, ()=>api(`/api/slot/${slot}/${on?'enable':'disable'}`,{method:'POST'})); }
function exitIP(slot){ act(`exit IP (${slot})`, ()=>api('/api/exitip/'+slot,{method:'POST'}), r=>{ EXIT[slot]=r.exit_ip; render(); }); }
function verifyAll(){ act('verification', ()=>api('/api/verify',{method:'POST'}), r=>toast(`${r.pass} PASS / ${r.fail} FAIL` + (r.failures.length?'\n'+r.failures.join('\n'):''), r.fail?'bad':'ok')); }
function firewall(){ act('firewall', ()=>api('/api/firewall',{method:'POST'}), r=>{ toast(r.msg,'ok'); refreshStatus(); }); }
function reboot(){ confirmDo('Reboot the Pi? Every SSID, every tunnel and the other services on the Pi stay down for ~1-2 minutes.', 'reboot', ()=>api('/api/reboot',{method:'POST'}), ()=>toast('Rebooting… reload this page in about a minute.','ok')); }
function kick(mac, slot){ confirmDo(`Disconnect ${mac}?`, 'kick', ()=>api('/api/kick',{method:'POST',body:{mac,slot}}), refreshClients); }
function saveWifi(slot){ const ssid=$(`#ssid-${slot}`).value, psk=$(`#psk-${slot}`).value, cur=WIFI[slot]||{}; const b={}; if(ssid!==cur.ssid) b.ssid=ssid; if(psk!==cur.psk) b.psk=psk; if(!Object.keys(b).length) return toast('Nothing changed');
  confirmDo(`Apply the Wi-Fi settings of ${slot}?\n${b.ssid?`SSID: ${cur.ssid} → ${b.ssid}\n`:''}${b.psk?'The password will change\n':''}\nClients of this SSID are dropped and reconnect with the new settings.`, `Wi-Fi (${slot})`, ()=>api('/api/wifi/'+slot,{method:'POST',body:b}), async()=>{ WIFI[slot]=await api('/api/wifi/'+slot); await refreshStatus(); render(); toast('Applied','ok'); }); }
function addProfile(){ const name=$('#pname').value.trim(), conf=$('#pconf').value, ow=$('#pow').checked; if(!name||!conf) return toast('Name and config are required','bad');
  act('add profile', ()=>api('/api/profiles',{method:'POST',body:{name,conf,overwrite:ow}}), async r=>{ $('#pname').value=''; $('#pconf').value=''; await refreshProfiles(); toast(`"${r.name}" added` + (r.warnings?.length?'\n'+r.warnings.join('\n'):''), 'ok'); }); }
function delProfile(name){ confirmDo(`Delete "${name}"?`, 'delete profile', ()=>api('/api/profiles/'+encodeURIComponent(name),{method:'DELETE'}), refreshProfiles); }
async function loadLogs(){ const r = await api('/api/logs?lines=120'); $('#logpre').textContent = r.lines.join('\n'); }
function changePw(){ const p=prompt('New web password (8-128 characters):'); if(!p) return; act('password', ()=>api('/api/password',{method:'POST',body:{password:p}}), ()=>toast('Password changed','ok')); }

// ---------------- rendering
function render(){
  if (!ST) return;
  if (tab==='slots') {
    const s=ST; let h='';
    for (const sl of s.slots) {
      const healthy = sl.enabled && sl.ap.up && sl.vpn.healthy && sl.killswitch;
      const other = s.slots.length===2 ? s.slots.find(x=>x.name!==sl.name) : null;
      const direct = sl.mode==='direct';
      const opts = PROFILES.map(p => { const mine = p.slot===sl.name, used = p.slot && !mine; return `<option value="${esc(p.name)}" data-from="${esc(p.slot||'')}" ${mine?'selected':''}>${esc(p.name)}${mine?' (this SSID)':used?` — taken from ${esc(p.slot)}`:''}</option>`; }).join('');
      const radio = sl.radio||{};
      h += `<div class="card"><div class="h"><span class="dot ${healthy?'ok':sl.enabled?'warn':''}"></span><b class="mono">${esc(sl.name)}</b><span class="k">${healthy?'healthy':sl.enabled?'problem':'off'}</span><span class="sp" style="flex:1"></span>
        <span class="k">SSID</span><button class="switch ${sl.enabled?'on':''}" onclick="toggleSlot('${esc(sl.name)}',${!sl.enabled})" title="${sl.enabled?'Turn off':'Turn on'}"><i></i></button></div>
        <div class="slot">
          <div class="col"><span class="k">Wi-Fi</span><span class="big">${esc(sl.ap.ssid)}</span><span class="mono k">${esc(sl.ap.band)} · channel ${sl.ap.channel} · ${sl.ap.width_mhz ?? "?"} MHz · ${esc(sl.ap.if)}</span>
            <span class="mono k" title="This slot follows this radio, not the interface name">📻 ${esc(radio.mac||'—')}${radio.driver?' · '+esc(radio.driver):''}${radio.present===false?' <b style="color:var(--bad)">device missing</b>':''}${radio.present===false?` <button class="btn s" onclick="syncRadio('${esc(sl.name)}')">Find it</button>`:''}</span>
            <span><span class="dot ${sl.ap.up?'ok':'bad'}"></span> ${sl.ap.up?'on the air':'DOWN'} <span class="k">· ${sl.clients} clients · ${esc(sl.net)}</span></span></div>
          <div class="col"><span class="k">Exit</span>
            <div class="row"><span class="tag ${direct?'':'ok'}">${direct?'DIRECT · no VPN':'VPN only'}</span>
              <button class="btn s" onclick="setMode('${esc(sl.name)}','${direct?'vpn':'direct'}')" ${sl.enabled?'':'disabled'}>${direct?'Put behind a VPN':'Switch to direct'}</button></div>
            ${direct ? `<span class="k">Clients exit through the LAN (${esc(ST.lan.if||'')}) with no tunnel. They still cannot reach the LAN itself.</span>` : `
            <div class="row"><select id="prof-${esc(sl.name)}" ${sl.enabled?'':'disabled'}><option value="">— select a profile —</option>${opts}</select>
              <button class="btn s p" onclick="(()=>{const o=$('#prof-${esc(sl.name)}').selectedOptions[0]; if(!o||!o.value) return; if(o.dataset.from==='${esc(sl.name)}') return toast('Already this profile'); setProfile('${esc(sl.name)}', o.value, o.dataset.from||null);})()" ${sl.enabled?'':'disabled'}>Apply</button>
              ${other && other.mode!=='direct' ?`<button class="btn s" onclick="swapSlots('${esc(sl.name)}','${esc(other.name)}')" title="Swap the profiles of the two SSIDs">⇄ swap with ${esc(other.name)}</button>`:''}</div>
            <span><span class="dot ${sl.vpn.healthy?'ok':'bad'}"></span> ${sl.vpn.healthy?`handshake ${fmtD(sl.vpn.handshakeAge??sl.vpn.handshake_age_s??0)} ago`:'no tunnel'} <span class="mono k">· ${esc(sl.vpn.endpoint||'-')} · ${esc(sl.vpn.if)} ${esc(sl.vpn.address||'')}</span></span>
            <span class="k">↓${fmtB(sl.vpn.rx_bytes)} ↑${fmtB(sl.vpn.tx_bytes)}</span>`}
            <div class="row"><span class="k">Exit IP:</span><b class="mono">${esc(EXIT[sl.name]||'—')}</b><button class="btn s" onclick="exitIP('${esc(sl.name)}')" ${sl.vpn.up?'':'disabled'}>Query</button></div></div>
          <div class="col" style="align-items:flex-end"><span class="tag ${sl.killswitch?'ok':'bad'}">${sl.killswitch?'✓ kill switch':'✗ NO kill switch'}</span>
            <span class="tag ${sl.pin?.ok?'ok':'bad'}" title="${esc(sl.pin?.msg||'')}">${sl.pin?.ok?(sl.pin.pinned?`🔒 pinned: ${esc(sl.pin.profile||sl.mode)}`:'not pinned'):'⚠ PIN VIOLATION'}</span></div>
        </div>
        ${sl.pin && !sl.pin.ok ? `<div class="viol"><b>ASSIGNMENT VIOLATION — the SSID was stopped (fail-closed).</b> ${esc(sl.pin.violation||sl.pin.msg)}<br><span class="k">If you did not make this change, investigate first. If the current state is correct:</span> <button class="btn s" onclick="rePin('${esc(sl.name)}')">Re-pin</button></div>` : ''}
        </div>`;
    }
    const svc = Object.entries(s.services||{}).map(([k,v])=>`<span class="tag ${v?'ok':'bad'} mono">${esc(k)}</span>`).join(' ');
    h += `<div class="card"><div class="h"><span class="dot ${Object.values(s.services||{}).every(Boolean)?'ok':'bad'}"></span><b>Pi</b></div>
      <div class="row" style="gap:22px"><span><span class="k">LAN</span><br><span class="mono">${esc(s.lan.if)} ${esc(s.lan.ip)}</span></span><span><span class="k">Gateway</span><br><span class="mono">${esc(s.lan.gw)}</span></span><span><span class="k">Uptime</span><br>${fmtD(s.uptime_s)}</span><span><span class="k">Load</span><br>${s.load1}</span><span><span class="k">Temp</span><br>${s.temp_c!=null?s.temp_c.toFixed(1)+'°C':'-'}</span><span style="flex:1"></span>${svc}</div></div>
      <div class="row"><button class="btn" onclick="refreshAll()">Refresh</button><button class="btn" onclick="verifyAll()">Full verification</button><button class="btn" onclick="firewall()">Re-apply firewall</button><button class="btn" onclick="changePw()">Web password</button><span style="flex:1"></span><button class="btn d" onclick="reboot()">Reboot</button></div>`;
    $('#t-slots').innerHTML = h;
  }
  if (tab==='clients') {
    $('#t-clients').innerHTML = `<div class="card"><div class="h"><b>Connected clients</b><span class="k">${CLIENTS.length}</span><span style="flex:1"></span><button class="btn s" onclick="refreshClients()">Refresh</button></div>` +
      (CLIENTS.length? `<table><tr><th>SSID</th><th>Device</th><th>IP</th><th>MAC</th><th>Signal</th><th>Rate</th><th>Connected</th><th>Traffic</th><th></th></tr>` +
      CLIENTS.map(c=>`<tr><td class="mono">${esc(c.slot)}</td><td>${esc(c.hostname||'—')}</td><td class="mono">${esc(c.ip||'—')}</td><td class="mono">${esc(c.mac)}</td><td style="color:${(c.signal_dbm??-100)>-65?'var(--ok)':'var(--warn)'}">${c.signal_dbm??'—'} dBm</td><td>${c.tx_rate_mbps?Math.round(c.tx_rate_mbps)+' Mbps':'—'}</td><td>${c.connected_s!=null?fmtD(c.connected_s):'—'}</td><td class="k">↓${fmtB(c.tx_bytes)} ↑${fmtB(c.rx_bytes)}</td><td><button class="btn s" onclick="kick('${esc(c.mac)}','${esc(c.slot)}')">Kick</button></td></tr>`).join('') + '</table>'
      : '<p class="k">No clients are connected right now.</p>') + '</div>';
  }
  if (tab==='wifi') {
    $('#t-wifi').innerHTML = ST.slots.map(sl => { const w = WIFI[sl.name]||{}; return `<div class="card"><div class="h"><b class="mono">${esc(sl.name)}</b><span class="k">${esc(w.band||sl.ap.band)} · channel ${w.channel??sl.ap.channel} · ${esc(w.if||sl.ap.iface)} · VPN: ${esc(sl.vpn.profile||'—')}</span></div>
      <div class="col" style="max-width:520px"><label class="k">Network name (SSID)</label><input type="text" id="ssid-${esc(sl.name)}" value="${esc(w.ssid??'')}" maxlength="32">
      <label class="k">Password</label><div class="row"><input type="password" id="psk-${esc(sl.name)}" value="${esc(w.psk??'')}" style="flex:1" class="mono"><button class="btn s" onclick="(i=>i.type=i.type==='password'?'text':'password')($('#psk-${esc(sl.name)}'))">Show/hide</button><button class="btn s" onclick="navigator.clipboard.writeText($('#psk-${esc(sl.name)}').value);toast('Copied')">Copy</button></div>
      <p class="k">Ending the SSID with <span class="mono">_nomap</span> is recommended (it opts the network out of Wi-Fi positioning databases). Applying only drops the clients of this SSID.</p>
      <div class="row"><button class="btn p" onclick="saveWifi('${esc(sl.name)}')">Apply</button><button class="btn" onclick="refreshWifiAll()">Cancel</button></div></div></div>`; }).join('');
  }
  if (tab==='vpn') {
    $('#t-vpn').innerHTML = `<div class="card"><div class="h"><b>Profiles</b><span class="k">${PROFILES.length} · each profile can be on at most one SSID</span></div>` +
      (PROFILES.length ? `<table><tr><th>Name</th><th>Endpoint</th><th>Address</th><th>MTU</th><th>SSID</th><th></th></tr>` + PROFILES.map(p=>`<tr><td><b>${esc(p.name)}</b> <span class="tag">${esc(p.type)}</span></td><td class="mono">${esc(p.endpoint||'-')}</td><td class="mono">${esc(p.address||'-')}</td><td>${esc(p.mtu||'-')}</td><td>${p.slot?`<span class="tag ok mono">→ ${esc(p.slot)}</span>`:'<span class="k">unassigned</span>'}</td><td>${p.slot?'':`<button class="btn s d" onclick="delProfile('${esc(p.name)}')">Delete</button>`}</td></tr>`).join('') + '</table>' : '<p class="k">No profiles</p>') +
      `</div><div class="card"><div class="h"><b>New profile (WireGuard .conf)</b></div><div class="col"><div class="row"><input type="text" id="pname" placeholder="Profile name (letters/digits/-/_)" maxlength="32"><label class="k"><input type="checkbox" id="pow"> overwrite</label><input type="file" id="pfile" accept=".conf,text/plain" style="font-size:12px"></div>
      <textarea id="pconf" placeholder="[Interface]&#10;PrivateKey = …&#10;Address = …&#10;&#10;[Peer]&#10;PublicKey = …&#10;Endpoint = host:port&#10;AllowedIPs = 0.0.0.0/0"></textarea>
      <p class="k">The Pi sanitises the config (DNS/Table/PostUp are stripped, Table = off is enforced) and validates it with the kernel. When it is assigned to an SSID and no handshake arrives within 40 s, the previous profile is restored.</p>
      <div class="row"><button class="btn p" onclick="addProfile()">Send to the Pi</button></div></div></div>`;
    const f = $('#pfile'); if (f) f.onchange = async () => { const fl=f.files[0]; if(!fl) return; $('#pconf').value = await fl.text(); if(!$('#pname').value) $('#pname').value = fl.name.replace(/\.conf$/i,'').replace(/[^A-Za-z0-9_-]/g,'-'); };
  }
  if (tab==='logs') { if(!$('#logpre')) { $('#t-logs').innerHTML = `<div class="card"><div class="h"><b>Pi log</b><span style="flex:1"></span><button class="btn s" onclick="loadLogs()">Refresh</button></div><pre class="log" id="logpre">…</pre></div>`; loadLogs(); } }
}

// ---------------- startup
(async () => { try { const me = await api('/api/me'); $('#title').textContent = (me.name||'PiAP') + ' Manager'; if (me.authed) { showApp(); await refreshAll(); } else showLogin(); } catch(e) { showLogin(); } })();
</script>
</body>
</html>
